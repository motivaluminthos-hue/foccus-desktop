name: Build

# Dispara sozinho a cada tag v* — MAS atenção: o GitHub ignora o disparo quando mais de três tags
# são enviadas de uma vez. Publique sempre uma tag por vez ("git push origin v1.0.26"), nunca
# "git push --tags". Foi por isso que o instalador do Mac ficou parado na 1.0.4: as tags iam todas
# juntas e o workflow nunca rodava.
on:
  workflow_dispatch:
    inputs:
      plataforma:
        description: 'O que construir'
        type: choice
        options: [ambos, mac, windows]
        default: ambos
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            plataforma: windows
            script: dist:win
            artifact: foccus-windows
            files: dist/Foccus-Setup.exe
          - os: macos-latest
            plataforma: mac
            script: dist:mac
            artifact: foccus-mac
            files: dist/*.dmg
    # por tag continua construindo os dois; no disparo manual dá pra pedir um só,
    # que é o jeito de refazer o Mac sem mexer no .exe que já está publicado
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.plataforma == 'ambos' ||
      inputs.plataforma == matrix.plataforma
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
      - name: Publicar na Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
