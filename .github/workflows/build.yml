name: Build

# Dispara sozinho a cada tag v* — MAS atenção: o GitHub ignora o disparo quando mais de três tags
# são enviadas de uma vez. Publique sempre uma tag por vez ("git push origin v1.0.26"), nunca
# "git push --tags". Foi por isso que o instalador do Mac ficou parado na 1.0.4: as tags iam todas
# juntas e o workflow nunca rodava.
on:
  workflow_dispatch:
    inputs:
      plataforma:
        description: 'O que construir'
        type: choice
        options: [ambos, mac, windows]
        default: ambos
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            plataforma: windows
            script: dist:win
            artifact: foccus-windows
            files: dist/Foccus-Setup.exe
          - os: macos-latest
            plataforma: mac
            script: dist:mac
            artifact: foccus-mac
            files: dist/*.dmg
    runs-on: ${{ matrix.os }}
    # por tag constrói os dois; no disparo manual dá pra pedir um só, que é o jeito de refazer o
    # Mac sem reconstruir o .exe já publicado. A condição fica NOS PASSOS porque "matrix" não
    # existe na condição do job — o GitHub recusa o arquivo inteiro se for usada lá.
    env:
      FAZER: ${{ github.event_name != 'workflow_dispatch' && 'sim' || (inputs.plataforma == 'ambos' && 'sim' || (inputs.plataforma == matrix.plataforma && 'sim' || 'nao')) }}
    steps:
      - uses: actions/checkout@v4
        if: env.FAZER == 'sim'
      - uses: actions/setup-node@v4
        if: env.FAZER == 'sim'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.FAZER == 'sim'
      - run: npm run ${{ matrix.script }}
        if: env.FAZER == 'sim'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        if: env.FAZER == 'sim'
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
      - name: Publicar na Release
        if: env.FAZER == 'sim' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
